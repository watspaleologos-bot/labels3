<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d2742">
<title>Paleologos Labels 3 – Remote Read Only</title>
<style>
:root{--navy:#0d2742;--blue:#27aae1;--ink:#172033;--muted:#667085;--bg:#f4f7fa;--line:#dbe3ea;--green:#15803d;--red:#b42318;--orange:#b54708;--purple:#7f56d9}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.hidden{display:none!important}.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:var(--navy);color:#fff;padding:16px 14px 22px;position:sticky;top:0;height:100vh;z-index:30}.brand{padding:2px 4px 20px}.brand img{display:block;width:100%;max-width:184px;margin:auto;background:#fff;border-radius:10px;padding:8px 9px}.brand small{display:block;font-size:10px;letter-spacing:.08em;color:#9fc0d7;margin-top:7px;text-align:center}.nav{display:grid;gap:7px}.nav button{border:0;border-radius:10px;padding:12px 13px;text-align:left;background:transparent;color:#c9d8e5;font-weight:700;cursor:pointer}.nav button.active{background:#fff;color:var(--navy)}.sidefoot{position:absolute;bottom:18px;left:20px;right:20px;font-size:10px;color:#8eacbf;line-height:1.45}.main{min-width:0}.top{min-height:82px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:8;gap:16px}.topleft{display:flex;align-items:center;gap:10px}.menubtn{display:none;border:0;background:#edf4f8;color:var(--navy);border-radius:9px;width:38px;height:38px;font-size:21px;font-weight:900}.topleft h1{margin:0;font-size:20px}.topright{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}.badge{font-size:10px;font-weight:900;padding:6px 9px;border-radius:999px;border:1px solid #f4b8aa;background:#fff0ed;color:var(--red)}.sync{font-size:10px;font-weight:800;color:var(--green)}.sync.stale{color:var(--red)}.content{padding:18px 22px 40px;max-width:1680px;margin:auto}.btn{border:0;border-radius:8px;padding:9px 13px;font-weight:800;cursor:pointer}.secondary{background:#eaf1f6;color:var(--navy)}.primary{background:var(--blue);color:#fff}.boardhead,.flowhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}.boardtitle,.flowtitle{display:flex;align-items:center;gap:9px}.boardtitle h2,.flowtitle h2{margin:0;font-size:21px}.boardsub,.flowsub{margin:2px 0 0 34px;color:var(--muted);font-size:11px}.boardtoolbar,.flowactions{display:flex;gap:6px}.boardgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.boardcol{background:#eef3f7;border:1px solid #d9e2e9;border-radius:12px;padding:8px}.boardcol h3{font-size:12px;margin:3px 3px 8px;text-align:center;color:#344054}.boardcards{display:grid;gap:6px}.boardcard{position:relative;border:1px solid #d0d5dd;border-radius:9px;padding:8px;background:#fff}.boardcardhead{display:flex;justify-content:space-between;gap:8px}.boarddelivery{font-size:11px;font-weight:900}.boardidentity{font-size:10px;font-weight:850;text-align:right;max-width:65%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.boardsubline{font-size:9px;color:var(--muted);font-weight:800;margin:2px 0 5px}.boardproduct{font-size:10px;line-height:1.3;padding:2px 0}.boardnote{font-size:9px;color:var(--muted);text-align:center}.boardpriority{position:absolute;right:8px;bottom:7px;background:#eaf4ff;color:#175cd3;border-radius:999px;padding:3px 8px;font-size:13px;font-weight:900}.boardprod{position:absolute;left:8px;bottom:7px;font-size:10px;color:#b54708;font-weight:900}.boardfooter{font-size:10px;color:var(--muted);margin-top:8px}.flowtitle .icon{font-size:24px;color:#1570ef}.flowsummary{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin-bottom:7px}.flowmetric{border:1px solid #dfe7ee;border-radius:10px;background:#fff;padding:9px 10px;text-align:left;cursor:pointer;border-top:3px solid var(--metric,#1570ef)}.flowmetric b{display:block;font-size:19px}.flowmetric span{display:block;font-size:9px;color:var(--muted);margin-top:4px;font-weight:800}.flowmetric.prod{--metric:#f79009}.flowmetric.ready{--metric:#12b76a}.flowmetric.delivered{--metric:#2e90fa}.flowmetric.waiting{--metric:#7f56d9}.flowmetric.overdue{--metric:#d92d20}.flowprogress{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:10px;margin:0 2px 8px;font-size:10px;font-weight:800;color:#475467}.flowprogressbar{height:7px;background:#d0d5dd;border-radius:999px;overflow:hidden}.flowprogressbar span{display:block;height:100%;background:#1570ef}.flowtabs,.waretabs{display:flex;gap:4px;background:#e9eef3;border-radius:8px;padding:4px;margin-bottom:8px;overflow:auto}.flowtabs button,.waretabs button{flex:1;border:0;border-radius:6px;padding:8px 10px;background:#667085;color:#fff;font-size:10px;font-weight:850;cursor:pointer;min-width:115px}.flowtabs button.active,.waretabs button.active{background:#1570ef}.flowcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;align-items:start}.flowcard{position:relative;background:#fff;border:1px solid #d0d5dd;border-radius:8px;padding:8px}.flowcardhead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px}.flowdate{font-size:11px;font-weight:900}.flowidentity{display:flex;flex-direction:column;align-items:flex-end;gap:3px;min-width:0}.flowcustomer{max-width:100%;font-size:10px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.flowpriority{background:#eaf4ff;color:#175cd3;border-radius:999px;padding:3px 8px;font-size:13px;font-weight:900}.floword{font-size:9px;color:var(--muted);font-weight:800;margin:2px 0 4px}.flowline{font-size:10px;font-weight:720;line-height:1.3;padding:2px 0}.flowline .qty{font-weight:900;color:#0f5e9c}.flownote{font-size:9px;color:var(--muted);text-align:center}.flowcardactions{display:flex;justify-content:flex-end;margin-top:5px}.flowbarcodebtn{border:1px solid #d0d5dd;background:#eef2f6;color:#344054;border-radius:5px;padding:4px 8px;font-size:9px;font-weight:900;cursor:pointer}.flowsplit{display:grid;grid-template-columns:1fr 1fr;gap:8px}.flowsplit h3{font-size:12px;text-align:center;margin:0 0 5px}.flowtoolbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:7px}.flowtoolbar input,.flowtoolbar select{height:32px;border:1px solid #cbd5df;border-radius:7px;padding:0 9px;background:#fff;font-size:11px}.grow{min-width:240px;flex:1}.flowtablewrap{background:#fff;border:1px solid #dfe6ec;border-radius:9px;overflow:auto;max-height:62vh}.flowtable{width:100%;border-collapse:collapse}.flowtable th{position:sticky;top:0;background:#f7f9fb;padding:8px 9px;font-size:10px;color:#526071;text-align:left}.flowtable td{padding:8px 9px;font-size:10px;border-bottom:1px solid #edf1f4;vertical-align:top}.flowempty{background:#fff;border:1px dashed #cbd5df;border-radius:9px;padding:36px;text-align:center;color:var(--muted);font-size:12px}.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid #cbd5df;border-radius:999px;padding:5px 9px;font-size:10px;font-weight:800;background:#fff;cursor:pointer}.pill.active{background:#eaf4ff;color:#175cd3;border-color:#84adff}.overlay{position:fixed;inset:0;background:rgba(7,22,36,.56);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px}.modal{width:min(900px,96vw);max-height:88vh;background:#fff;border-radius:16px;overflow:hidden;display:flex;flex-direction:column}.mhead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}.mhead h2{font-size:16px;margin:0}.mhead button{border:0;background:#eef2f6;border-radius:8px;width:34px;height:34px;cursor:pointer}.mbody{padding:14px 16px;overflow:auto}.login{width:min(380px,94vw)}.login input{width:100%;height:44px;border:1px solid #cbd5df;border-radius:9px;padding:0 12px;margin:12px 0}.error{color:var(--red);font-size:11px;font-weight:800;min-height:16px}.staleBanner{background:#fff0ed;color:#b42318;border:1px solid #f4b8aa;border-radius:9px;padding:8px 10px;font-size:10px;font-weight:800;margin-bottom:10px}.readOnlyNote{font-size:10px;color:var(--muted);font-weight:700}.sideshade{display:none;position:fixed;inset:0;background:rgba(7,22,36,.48);z-index:29}
@media(max-width:1100px){.flowsummary{grid-template-columns:repeat(3,1fr)}.flowcards{grid-template-columns:repeat(2,1fr)}}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{position:fixed;left:0;top:0;width:250px;transform:translateX(-105%);transition:transform .18s}.side.open{transform:translateX(0)}.sideshade.show{display:block}.menubtn{display:inline-flex;align-items:center;justify-content:center}.top{padding:0 12px;min-height:68px}.content{padding:12px}.boardhead,.flowhead{display:block}.boardtoolbar,.flowactions{margin-top:8px}.boardgrid{grid-template-columns:1fr}.flowsummary{grid-template-columns:1fr 1fr}.flowcards{grid-template-columns:1fr}.flowsplit{grid-template-columns:1fr}.flowprogress{grid-template-columns:1fr}.topright .badge{display:none}}@media(max-width:520px){.topleft h1{font-size:16px}.sync{font-size:9px}.flowsummary{gap:5px}.flowmetric{padding:8px}.flowmetric b{font-size:18px}.content{padding:10px}.boardcard,.flowcard{padding:7px}}
</style></head>
<body><div id="shade" class="sideshade"></div><div class="shell"><aside id="side" class="side"><div class="brand"><img src="/header_logo.png" alt="Στρώμα Παλαιολόγος"><small>LABEL 3 · REMOTE READ ONLY</small></div><nav class="nav"><button id="navBoard" class="active">Πίνακας Παραγωγής</button><button id="navFlow">Ροή Παραγωγής</button></nav><div class="sidefoot">Προβολή μόνο · Δεν επιτρέπονται αλλαγές παραγωγής από Internet.</div></aside><main class="main"><header class="top"><div class="topleft"><button id="menu" class="menubtn">☰</button><h1 id="title">Πίνακας Παραγωγής</h1></div><div class="topright"><span class="badge">REMOTE · READ ONLY</span><span id="sync" class="sync">● Αναμονή συγχρονισμού</span></div></header><section class="content"><div id="stale" class="staleBanner hidden"></div><div id="boardView"></div><div id="flowView" class="hidden"></div></section></main></div>
<div id="login" class="overlay"><div class="modal login"><div class="mhead"><h2>Label 3 Remote</h2></div><div class="mbody"><div class="readOnlyNote">Πίνακας Παραγωγής + Ροή Παραγωγής · μόνο προβολή</div><input id="pin" type="password" inputmode="numeric" placeholder="PIN προβολής"><button id="loginBtn" class="btn primary" style="width:100%">Σύνδεση</button><div id="loginErr" class="error"></div></div></div></div>
<div id="modal" class="overlay hidden"><div class="modal"><div class="mhead"><h2 id="modalTitle">Λεπτομέρειες</h2><button id="modalClose">✕</button></div><div id="modalBody" class="mbody"></div></div></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),d=s=>{if(!s)return'—';let x=String(s).slice(0,10).split('-');return x.length===3?`${x[2]}/${x[1]}/${x[0]}`:s},stamp=s=>{if(!s)return'—';return d(s)+' '+String(s).slice(11,16)};
let pin=sessionStorage.getItem('label3ViewPin')||'',state=null,current='board',flowTab='production',deliveredFilter='TODAY',wareSub='stock',wareMerge=false,wareSearch='';
function openModal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modal').classList.remove('hidden')} $('modalClose').onclick=()=>$('modal').classList.add('hidden');
async function api(path,opt={}){opt.headers=Object.assign({'X-View-PIN':pin},opt.headers||{});let r=await fetch(path,opt);let j={};try{j=await r.json()}catch(e){}if(r.status===401){sessionStorage.removeItem('label3ViewPin');pin='';$('login').classList.remove('hidden');throw new Error('Χρειάζεται ξανά PIN.')}if(!r.ok)throw new Error(j.error||'Σφάλμα επικοινωνίας.');return j}
async function login(){let candidate=$('pin').value.trim();$('loginErr').textContent='';try{let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:candidate})});if(!r.ok)throw new Error('Λάθος PIN.');pin=candidate;sessionStorage.setItem('label3ViewPin',pin);$('login').classList.add('hidden');await refresh()}catch(e){$('loginErr').textContent=e.message}} $('loginBtn').onclick=login;$('pin').onkeydown=e=>{if(e.key==='Enter')login()};
function setMenu(open){$('side').classList.toggle('open',open);$('shade').classList.toggle('show',open)} $('menu').onclick=()=>setMenu(!$('side').classList.contains('open'));$('shade').onclick=()=>setMenu(false);
function show(view){current=view;$('boardView').classList.toggle('hidden',view!=='board');$('flowView').classList.toggle('hidden',view!=='flow');$('navBoard').classList.toggle('active',view==='board');$('navFlow').classList.toggle('active',view==='flow');$('title').textContent=view==='board'?'Πίνακας Παραγωγής':'Ροή Παραγωγής';setMenu(false);render()};$('navBoard').onclick=()=>show('board');$('navFlow').onclick=()=>show('flow');
function syncStatus(env){if(!env.received_at){$('sync').textContent='● Δεν έχει γίνει συγχρονισμός';$('sync').classList.add('stale');$('stale').textContent='Δεν υπάρχουν ακόμη δεδομένα από το Label 3 του εργοστασίου.';$('stale').classList.remove('hidden');return}let age=(Date.now()-Date.parse(env.received_at))/1000,stale=age>120;$('sync').textContent=`● Τελευταίος συγχρονισμός ${new Date(env.received_at).toLocaleTimeString('el-GR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}`;$('sync').classList.toggle('stale',stale);$('stale').classList.toggle('hidden',!stale);if(stale)$('stale').textContent=`Προσοχή: τα δεδομένα δεν έχουν ενημερωθεί εδώ και ${Math.max(2,Math.round(age/60))} λεπτά.`}
async function refresh(){try{let j=await api('/api/state');syncStatus(j);state=j.state;render()}catch(e){if(pin)$('sync').textContent='● Χωρίς σύνδεση'}}
function boardPriorityText(v){let n=Number(v||0),circ=['','①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩','⑪','⑫','⑬','⑭','⑮','⑯','⑰','⑱','⑲','⑳'];return n?(circ[n]||`◯${n}`):''}
function boardColor(o){if(o.delivery_state==='OVERDUE')return'#FDEDEC';if(o.delivery_state==='TODAY')return'#FEF5E7';if(o.delivery_state==='NONE')return'#EAF2F8';return'#fff'}
function boardProduct(i){let total=Number(i.quantity||0),done=Number(i.completed_quantity||0),q=(i.has_progress||i.completed_today)?`${done}/${total}`:String(total),p=[i.product_category||'',i.mattress_type||''].filter(Boolean);if(i.width_cm&&i.length_cm)p.push(`${i.width_cm}×${i.length_cm}`);if(i.height_cm)p.push(`ΥΨΟΣ ${i.height_cm}`);if(i.low_spring)p.push('ΧΑΜΗΛΟ');if(i.fabric)p.push(i.fabric);if(i.legs)p.push(i.legs);return`${q} × ${p.join(' · ')}`}
function boardGroup(rows){if(!rows.length)return'<div class="flowempty">Δεν υπάρχουν ενεργές παραγγελίες.</div>';return`<div class="boardcards">${rows.map(o=>`<article class="boardcard" style="background:${boardColor(o)}"><div class="boardcardhead"><span class="boarddelivery">${esc(o.delivery_date?d(o.delivery_date):'ΑΠΟΘΗΚΗ')}</span><span class="boardidentity">${esc(o.customer_display||'')}</span></div><div class="boardsubline">${esc([o.order_type==='RETAIL'?o.retail_store_name:'',o.order_number].filter(Boolean).join(' · '))}</div>${(o.items||[]).map(i=>`<div class="boardproduct">${esc(boardProduct(i))}</div>${i.notes?`<div class="boardnote">${esc(i.notes)}</div>`:''}`).join('')}${o.priority?`<div class="boardpriority">${boardPriorityText(o.priority)}</div>`:''}${o.status==='IN_PRODUCTION'?`<div class="boardprod">▰</div>`:''}</article>`).join('')}</div>`}
function renderBoard(){let b=state?.board;if(!b){$('boardView').innerHTML='<div class="flowempty">Δεν έχει γίνει ακόμη συγχρονισμός.</div>';return}let total=(b.retail||[]).length+(b.wholesale_and_stock||[]).length;$('boardView').innerHTML=`<div class="boardhead"><div><div class="boardtitle"><span style="font-size:24px;color:#1570ef">▰</span><h2>ΠΙΝΑΚΑΣ ΠΑΡΑΓΩΓΗΣ</h2></div><div class="boardsub">${d(b.plan_date)} · όλες οι ενεργές παραγγελίες</div></div><div class="boardtoolbar"><button class="btn secondary" onclick="refresh()">Ανανέωση</button></div></div><div class="boardgrid"><section class="boardcol"><h3>ΛΙΑΝΙΚΗ</h3>${boardGroup(b.retail||[])}</section><section class="boardcol"><h3>ΧΟΝΔΡΙΚΗ / ΑΠΟΘΗΚΗ</h3>${boardGroup(b.wholesale_and_stock||[])}</section></div><div class="boardfooter">Ενεργές: ${total} · Αριθμημένες σήμερα: ${Number(b.priority_count||0)} · Remote προβολή μόνο.</div>`}
function flowQty(item,tab){return Number(tab==='production'?item.in_production:tab==='ready'?item.ready:item.delivered||item.quantity||0)}
function flowCard(o,tab){let date=o.delivery_date?d(o.delivery_date):'ΑΠΟΘΗΚΗ';return`<article class="flowcard"><div class="flowcardhead"><span class="flowdate">${date}</span><div class="flowidentity"><span class="flowcustomer">${esc(o.customer_display||'')}</span>${o.priority?`<span class="flowpriority">${boardPriorityText(o.priority)}</span>`:''}</div></div><div class="floword">${esc(o.order_number||'')}</div>${(o.items||[]).filter(i=>flowQty(i,tab)>0).map(i=>`<div class="flowline"><span class="qty">${flowQty(i,tab)} ×</span> ${esc(i.product_text||'')}</div>${i.notes?`<div class="flownote">${esc(i.notes)}</div>`:''}`).join('')}<div class="flowcardactions"><button class="flowbarcodebtn" onclick="showBarcodes(${Number(o.id)})">BARCODES</button></div></article>`}
function cards(rows,tab){return rows.length?`<div class="flowcards">${rows.map(o=>flowCard(o,tab)).join('')}</div>`:'<div class="flowempty">Δεν υπάρχουν εγγραφές.</div>'}
function showBarcodes(orderId){let p=state?.order_barcodes?.[String(orderId)],rows=p?.units||[];openModal('Barcodes',rows.length?`<div class="flowtablewrap"><table class="flowtable"><thead><tr><th>Προϊόν</th><th>Barcode</th><th>Status</th><th>Ώρα</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.product_text||'')}</td><td><b>${esc(r.unique_code||'')}</b></td><td>${esc(r.status_label||'')}</td><td>${esc((r.delivered_at||r.ready_at||'').slice(0,16))}</td></tr>`).join('')}</tbody></table></div>`:'<div class="flowempty">Δεν υπάρχουν barcodes.</div>')}
function renderSummary(){let s=state?.flow?.summary||{};return`<div class="flowsummary"><button class="flowmetric prod" onclick="summaryDetail('in_production')"><b>${Number(s.in_production||0)}</b><span>ΣΕ ΠΑΡΑΓΩΓΗ</span></button><button class="flowmetric ready" onclick="summaryDetail('ready_today')"><b>${Number(s.ready_today||0)}</b><span>ΕΤΟΙΜΑ ΣΗΜΕΡΑ</span></button><button class="flowmetric delivered" onclick="summaryDetail('delivered_today')"><b>${Number(s.delivered_today||0)}</b><span>ΠΑΡΑΔΟΘΗΚΑΝ ΣΗΜΕΡΑ</span></button><button class="flowmetric waiting" onclick="summaryDetail('ready_waiting')"><b>${Number(s.ready_waiting||0)}</b><span>ΕΤΟΙΜΑ ΠΡΟΣ ΠΑΡΑΔΟΣΗ</span></button><button class="flowmetric overdue" onclick="summaryDetail('overdue')"><b>${Number(s.overdue||0)}</b><span>ΚΑΘΥΣΤΕΡΗΜΕΝΑ ΠΑΡΑΓΩΓΗΣ</span></button></div><div class="flowprogress"><span>Πρόοδος παραγωγής σήμερα: ${Number(s.completed_today||0)} / ${Number(s.workload_today||0)} — ${Number(s.progress_pct||0).toFixed(0)}%</span><div class="flowprogressbar"><span style="width:${Math.max(0,Math.min(100,Number(s.progress_pct||0)))}%"></span></div></div>`}
function summaryDetail(kind){let p=state?.flow?.summary_details?.[kind],rows=p?.rows||[],labels={in_production:'Σε παραγωγή',ready_today:'Έτοιμα σήμερα',delivered_today:'Παραδόθηκαν σήμερα',ready_waiting:'Έτοιμα προς παράδοση',overdue:'Καθυστερημένα παραγωγής'};openModal(labels[kind]||'Ροή',`<b>Σύνολο: ${Number(p?.quantity_total||0)} τεμ.</b><div class="flowtablewrap" style="margin-top:8px"><table class="flowtable"><thead><tr><th>ORD</th><th>Πελάτης</th><th>Προϊόν</th><th>Τεμ.</th><th>Barcode</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.order_number||'')}</td><td>${esc(r.customer||'')}</td><td>${esc(r.product_text||'')}</td><td>${Number(r.quantity||0)}</td><td>${esc(r.unique_code||'')}</td></tr>`).join('')}</tbody></table></div>`) }
function normalize(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function wareRows(){let key=wareSub==='history'?'warehouse_history':(wareMerge?'warehouse_stock_merged':'warehouse_stock'),rows=[...((state?.flow?.[key]?.data?.rows)||[])];let q=normalize(wareSearch);if(q)rows=rows.filter(r=>normalize([r.product_text,r.unique_code,r.origin_display,r.source_order_number,r.source_customer_display,r.movement_label].join(' ')).includes(q));return rows}
function renderWarehouse(){let rows=wareRows();if(wareSub==='history')return`<div class="waretabs"><button class="${wareSub==='stock'?'active':''}" onclick="wareSub='stock';renderFlowHost()">Διαθέσιμα</button><button class="${wareSub==='history'?'active':''}" onclick="wareSub='history';renderFlowHost()">Ιστορικό Κινήσεων</button></div><div class="flowtoolbar"><input class="grow" placeholder="Αναζήτηση" value="${esc(wareSearch)}" oninput="wareSearch=this.value;renderFlowHost()"></div><div class="flowtablewrap"><table class="flowtable"><thead><tr><th>Ημερομηνία</th><th>Κίνηση</th><th>Προϊόν</th><th>Barcode</th><th>ORD / Προέλευση</th><th>Τεμ.</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${stamp(r.moved_at||r.event_at||r.created_at||r.stocked_at)}</td><td>${esc(r.movement_label||r.movement||'')}</td><td>${esc(r.product_text||'')}</td><td>${esc(r.unique_code||'')}</td><td>${esc(r.source_order_number||r.origin_display||'')}</td><td>${Number(r.quantity||0)}</td></tr>`).join('')}</tbody></table></div>`;return`<div class="waretabs"><button class="active" onclick="wareSub='stock';renderFlowHost()">Διαθέσιμα</button><button onclick="wareSub='history';renderFlowHost()">Ιστορικό Κινήσεων</button></div><div class="flowtoolbar"><input class="grow" placeholder="Αναζήτηση" value="${esc(wareSearch)}" oninput="wareSearch=this.value;renderFlowHost()"><button class="pill ${wareMerge?'active':''}" onclick="wareMerge=!wareMerge;renderFlowHost()">Συγχώνευση ίδιων</button></div><div class="flowtablewrap"><table class="flowtable"><thead><tr><th>Ημερομηνία</th><th>Προϊόν</th><th>Barcode</th><th>Προέλευση</th><th>Τεμ.</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.merged&&r.breakdown?.length>1?'—':stamp(r.stocked_at||r.ready_at)}</td><td>${esc(r.product_text||'')}</td><td>${esc(r.unique_code||'')}</td><td>${esc(r.origin_display||'Αποθήκη')}</td><td>${Number(r.quantity||0)}${r.merged&&r.breakdown?.length?`<div style="font-size:9px;color:#667085">${r.breakdown.map(x=>`↳ ${esc(x.date_display||x.stocked_at||x.production_date||'')} · ${Number(x.quantity||0)}`).join('<br>')}</div>`:''}</td></tr>`).join('')}</tbody></table></div>`}
function renderHistory(){let rows=state?.flow?.history?.data?.rows||[];return`<div class="flowtablewrap"><table class="flowtable"><thead><tr><th>Ημερομηνία / ώρα</th><th>Event</th><th>Πελάτης</th><th>Προϊόν</th><th>Barcode</th><th>Τεμ.</th></tr></thead><tbody>${rows.slice().reverse().map(r=>`<tr><td>${stamp(r.event_at)}</td><td>${esc(r.event_type||'')}</td><td>${esc(r.customer||r.customer_display||'')}</td><td>${esc(r.product_text||'')}</td><td>${esc(r.unique_code||'')}</td><td>${Number(r.quantity||1)}</td></tr>`).join('')}</tbody></table></div>`}
function renderFlowHost(){let host=$('flowHost');if(!host)return;if(flowTab==='production'){host.innerHTML=cards(state?.flow?.production?.data?.orders||[],'production')}else if(flowTab==='ready'){let x=state?.flow?.ready?.data||{};host.innerHTML=`<div class="flowsplit"><div><h3>ΛΙΑΝΙΚΗ</h3>${cards(x.retail||[],'ready')}</div><div><h3>ΧΟΝΔΡΙΚΗ / ΑΠΟΘΗΚΗ</h3>${cards(x.wholesale_and_stock||[],'ready')}</div></div>`}else if(flowTab==='delivered'){let x=state?.flow?.delivered?.[deliveredFilter]?.data||{};host.innerHTML=`<div class="flowtoolbar"><select onchange="deliveredFilter=this.value;renderFlowHost()"><option value="TODAY" ${deliveredFilter==='TODAY'?'selected':''}>Σήμερα</option><option value="YESTERDAY" ${deliveredFilter==='YESTERDAY'?'selected':''}>Χθες</option><option value="7D" ${deliveredFilter==='7D'?'selected':''}>7 ημέρες</option><option value="ALL" ${deliveredFilter==='ALL'?'selected':''}>Όλα</option></select><span style="font-size:10px;color:#667085;font-weight:800">${Number(x.quantity_total||0)} τεμ.</span></div>${cards(x.orders||[],'delivered')}`}else if(flowTab==='warehouse'){host.innerHTML=renderWarehouse()}else host.innerHTML=renderHistory()}
function renderFlow(){if(!state?.flow){$('flowView').innerHTML='<div class="flowempty">Δεν έχει γίνει ακόμη συγχρονισμός.</div>';return}$('flowView').innerHTML=`<div class="flowhead"><div><div class="flowtitle"><span class="icon">⇄</span><h2>ΡΟΗ ΠΑΡΑΓΩΓΗΣ</h2></div><div class="flowsub">Remote mirror · ίδια canonical read-models με το Web Office · χωρίς ενέργειες</div></div><div class="flowactions"><button class="btn secondary" onclick="refresh()">Ανανέωση</button></div></div>${renderSummary()}<div class="flowtabs"><button data-tab="production">Σε Παραγωγή</button><button data-tab="ready">Έτοιμα</button><button data-tab="delivered">Παραδόθηκαν</button><button data-tab="warehouse">Αποθήκη</button><button data-tab="history">Ιστορικό</button></div><div id="flowHost"></div>`;document.querySelectorAll('.flowtabs button').forEach(b=>{b.classList.toggle('active',b.dataset.tab===flowTab);b.onclick=()=>{flowTab=b.dataset.tab;document.querySelectorAll('.flowtabs button').forEach(x=>x.classList.toggle('active',x===b));renderFlowHost()}});renderFlowHost()}
function render(){if(current==='board')renderBoard();else renderFlow()}
if(pin){$('login').classList.add('hidden');refresh().catch(()=>{$('login').classList.remove('hidden')})}setInterval(()=>{if(pin)refresh()},10000);
</script></body></html>
