<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),d=s=>{if(!s)return'—';let x=String(s).slice(0,10).split('-');return x.length===3?`${x[2]}/${x[1]}/${x[0]}`:s},stamp=s=>{if(!s)return'—';return d(s)+' '+String(s).slice(11,16)};
let pin=sessionStorage.getItem('label3ViewPin')||'',state=null,stateHash='',current='board',flowTab='production',deliveredFilter='TODAY',wareSub='stock',wareMerge=false,wareSearch='',remoteToolsTab='day',remoteCoversView='current',remoteCoversScope='IN_PRODUCTION',remoteCoversMerge=false,modalKind='',remotePollBusy=false;
let railwayTheme=localStorage.getItem('label3RailwayTheme')||'light';
function resolveRailwayTheme(pref){if(pref==='system')return window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';return pref==='dark'?'dark':'light'}
function applyRailwayTheme(pref){railwayTheme=['light','dark','system'].includes(pref)?pref:'light';localStorage.setItem('label3RailwayTheme',railwayTheme);document.documentElement.dataset.theme=resolveRailwayTheme(railwayTheme);if($('themeSelect'))$('themeSelect').value=railwayTheme;let meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=document.documentElement.dataset.theme==='dark'?'#0b1118':'#0d2742';if(state)render()}
applyRailwayTheme(railwayTheme);$('themeSelect').onchange=()=>applyRailwayTheme($('themeSelect').value);if(window.matchMedia){let mq=window.matchMedia('(prefers-color-scheme: dark)');if(mq.addEventListener)mq.addEventListener('change',()=>{if(railwayTheme==='system')applyRailwayTheme('system')})}
function openModal(title,html,kind='generic',mobileFull=false){modalKind=kind;$('modalTitle').textContent=title;$('modalBody').innerHTML=html;let full=!!mobileFull&&remoteMobile();$('modal').classList.toggle('mobilefull',full);document.body.classList.toggle('remote-summary-lock',full&&kind==='summary');let pdf=$('modalPdf');if(pdf){pdf.classList.toggle('hidden',kind!=='summary');pdf.onclick=null}$('modal').classList.remove('hidden')} $('modalClose').onclick=()=>{modalKind='';document.body.classList.remove('remote-summary-lock');$('modal').classList.remove('mobilefull');let pdf=$('modalPdf');if(pdf){pdf.classList.add('hidden');pdf.onclick=null}$('modal').classList.add('hidden')};
let remoteInstallPrompt=null;
function remoteIos(){return /iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)}
function remoteStandalone(){return window.matchMedia?.('(display-mode: standalone)').matches===true||window.navigator.standalone===true}
function remoteMobile(){return remoteIos()||/Android|Mobile/i.test(navigator.userAgent)}
function refreshRemoteInstallButton(){let b=$('pwaInstallBtn');if(!b)return;if(remoteStandalone()){b.classList.remove('show');return}if(remoteInstallPrompt||remoteMobile())b.classList.add('show');else b.classList.remove('show')}
function closeRemoteInstallHelp(){$('pwaHelp')?.classList.remove('open')}
function showRemoteInstallHelp(){let ios=remoteIos(),intro=$('pwaHelpIntro'),steps=$('pwaHelpSteps');if(ios){intro.textContent='Στο iPhone/iPad η εγκατάσταση γίνεται από το Safari.';steps.innerHTML='<b>1.</b> Άνοιξε το Railway link στο Safari.<br><b>2.</b> Πάτησε Κοινή χρήση (□↑).<br><b>3.</b> Επίλεξε «Προσθήκη στην οθόνη Αφετηρίας».<br><b>4.</b> Πάτησε «Προσθήκη».<br><br>Μετά το Label 3 Remote θα ανοίγει από το ίδιο εικονίδιο σαν εφαρμογή.'}else{intro.textContent='Ο browser δεν έδωσε αυτόματο παράθυρο εγκατάστασης.';steps.innerHTML='<b>Android / Chrome:</b> άνοιξε το μενού ⋮ και επίλεξε «Εγκατάσταση εφαρμογής» ή «Προσθήκη στην αρχική οθόνη».<br><br>Μετά το Label 3 Remote θα ανοίγει από το εικονίδιο σαν εφαρμογή.'}$('pwaHelp')?.classList.add('open')}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();remoteInstallPrompt=e;refreshRemoteInstallButton()});
window.addEventListener('appinstalled',()=>{remoteInstallPrompt=null;refreshRemoteInstallButton()});
async function installRemoteApp(){if(remoteStandalone()){refreshRemoteInstallButton();return}if(remoteInstallPrompt){let p=remoteInstallPrompt;remoteInstallPrompt=null;p.prompt();try{await p.userChoice}catch(_e){}refreshRemoteInstallButton();return}showRemoteInstallHelp()}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js',{scope:'/'}).catch(()=>{}))}
window.addEventListener('load',refreshRemoteInstallButton);
async function api(path,opt={}){opt.headers=Object.assign({'X-View-PIN':pin},opt.headers||{});let r=await fetch(path,opt);let j={};try{j=await r.json()}catch(e){}if(r.status===401){sessionStorage.removeItem('label3ViewPin');pin='';$('login').classList.remove('hidden');throw new Error('Χρειάζεται ξανά PIN.')}if(!r.ok)throw new Error(j.error||'Σφάλμα επικοινωνίας.');return j}
async function login(){let candidate=$('pin').value.trim();$('loginErr').textContent='';try{let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:candidate})});if(!r.ok)throw new Error('Λάθος PIN.');pin=candidate;sessionStorage.setItem('label3ViewPin',pin);$('login').classList.add('hidden');await refresh()}catch(e){$('loginErr').textContent=e.message}} $('loginBtn').onclick=login;$('pin').onkeydown=e=>{if(e.key==='Enter')login()};
function setMenu(open){$('side').classList.toggle('open',open);$('shade').classList.toggle('show',open)} $('menu').onclick=()=>setMenu(!$('side').classList.contains('open'));$('shade').onclick=()=>setMenu(false);
function show(view){current=view;$('boardView').classList.toggle('hidden',view!=='board');$('flowView').classList.toggle('hidden',view!=='flow');$('navBoard').classList.toggle('active',view==='board');$('navFlow').classList.toggle('active',view==='flow');$('title').textContent=view==='board'?'Πίνακας Παραγωγής':'Ροή Παραγωγής';setMenu(false);render()};$('navBoard').onclick=()=>show('board');$('navFlow').onclick=()=>show('flow');
function syncStatus(env){if(!env.received_at){$('sync').textContent='● Δεν έχει γίνει συγχρονισμός';$('sync').classList.add('stale');$('stale').textContent='Δεν υπάρχουν ακόμη δεδομένα από το Label 3 του εργοστασίου.';$('stale').classList.remove('hidden');return}let contact=env.last_contact_at||env.received_at,age=(Date.now()-Date.parse(contact))/1000,stale=age>120;$('sync').textContent=`● Τελευταία επικοινωνία ${new Date(contact).toLocaleTimeString('el-GR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}`;$('sync').classList.toggle('stale',stale);$('stale').classList.toggle('hidden',!stale);if(stale)$('stale').textContent=`Προσοχή: δεν υπάρχει επικοινωνία με το Label 3 εδώ και ${Math.max(2,Math.round(age/60))} λεπτά.`}
async function refresh(){try{let j=await api('/api/state');syncStatus(j);state=j.state;stateHash=String(j.snapshot_hash||'');render();if(modalKind==='tools')refreshRemoteToolsView()}catch(e){if(pin)$('sync').textContent='● Χωρίς σύνδεση'}}
async function pollRemoteState(){if(!pin||remotePollBusy)return;remotePollBusy=true;try{let j=await api('/api/state-status');syncStatus(j);let next=String(j.snapshot_hash||'');if(next!==stateHash)await refresh()}catch(e){if(pin)$('sync').textContent='● Χωρίς σύνδεση'}finally{remotePollBusy=false}}
function boardPriorityText(v){let n=Number(v||0),circ=['','①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩','⑪','⑫','⑬','⑭','⑮','⑯','⑰','⑱','⑲','⑳'];return n?(circ[n]||`◯${n}`):''}
function boardColor(o){let dark=document.documentElement.dataset.theme==='dark';if(o.delivery_state==='OVERDUE')return dark?'#3b1d22':'#FDEDEC';if(o.delivery_state==='TODAY')return dark?'#3b2f18':'#FEF5E7';if(o.delivery_state==='NONE')return dark?'#17283a':'#EAF2F8';return dark?'#111a24':'#fff'}
function boardProduct(i){let total=Number(i.quantity||0),done=Number(i.completed_quantity||0),q=(i.has_progress||i.completed_today)?`${done}/${total}`:String(total),p=[i.product_category||'',i.mattress_type||''].filter(Boolean);if(i.width_cm&&i.length_cm)p.push(`${i.width_cm}×${i.length_cm}`);if(i.height_cm)p.push(`ΥΨΟΣ ${i.height_cm}`);if(i.low_spring)p.push('ΧΑΜΗΛΟ');if(i.fabric)p.push(i.fabric);if(i.legs)p.push(i.legs);return`${q} × ${p.join(' · ')}`}
function boardGroup(rows){if(!rows.length)return'<div class="flowempty">Δεν υπάρχουν ενεργές παραγγελίες.</div>';return`<div class="boardcards">${rows.map(o=>`<article class="boardcard" style="background:${boardColor(o)}"><div class="boardcardhead"><span class="boarddelivery">${esc(o.delivery_date?d(o.delivery_date):'ΑΠΟΘΗΚΗ')}</span><span class="boardidentity">${esc(o.customer_display||'')}</span></div><div class="boardsubline">${esc([o.order_type==='RETAIL'?o.retail_store_name:'',o.order_number].filter(Boolean).join(' · '))}</div>${(o.items||[]).map(i=>`<div class="boardproduct">${esc(boardProduct(i))}</div>${i.notes?`<div class="boardnote">${esc(i.notes)}</div>`:''}`).join('')}${o.priority?`<div class="boardpriority">${boardPriorityText(o.priority)}</div>`:''}</article>`).join('')}</div>`}
function renderBoard(){let b=state?.board;if(!b){$('boardView').innerHTML='<div class="flowempty">Δεν έχει γίνει ακόμη συγχρονισμός.</div>';return}let total=(b.retail||[]).length+(b.wholesale_and_stock||[]).length;$('boardView').innerHTML=`<div class="boardhead"><div><div class="boardtitle"><span style="font-size:24px;color:#1570ef">▰</span><h2>ΠΙΝΑΚΑΣ ΠΑΡΑΓΩΓΗΣ</h2></div><div class="boardsub">${d(b.plan_date)} · όλες οι ενεργές παραγγελίες</div></div><div class="boardtoolbar"><button class="btn secondary" onclick="refresh()">Ανανέωση</button></div></div><div class="boardgrid"><section class="boardcol"><h3>ΛΙΑΝΙΚΗ</h3>${boardGroup(b.retail||[])}</section><section class="boardcol"><h3>ΧΟΝΔΡΙΚΗ / ΑΠΟΘΗΚΗ</h3>${boardGroup(b.wholesale_and_stock||[])}</section></div><div class="boardfooter">Ενεργές: ${total} · Αριθμημένες σήμερα: ${Number(b.priority_count||0)} · Remote προβολή μόνο.</div>`}
function flowQty(item,tab){return Number(tab==='production'?item.in_production:tab==='ready'?item.ready:item.delivered||item.quantity||0)}
function flowCard(o,tab){let date=o.delivery_date?d(o.delivery_date):'ΑΠΟΘΗΚΗ';return`<article class="flowcard"><div class="flowcardhead"><span class="flowdate">${date}</span><div class="flowidentity"><span class="flowcustomer">${esc(o.customer_display||'')}</span>${o.priority?`<span class="flowpriority">${boardPriorityText(o.priority)}</span>`:''}</div></div><div class="floword">${esc(o.order_number||'')}</div>${(o.items||[]).filter(i=>flowQty(i,tab)>0).map(i=>`<div class="flowline"><span class="qty">${flowQty(i,tab)} ×</span> ${esc(i.product_text||'')}</div>${i.notes?`<div class="flownote">${esc(i.notes)}</div>`:''}`).join('')}<div class="flowcardactions"><button class="flowbarcodebtn" onclick="showBarcodes(${Number(o.id)})">BARCODES</button></div></article>`}
function cards(rows,tab){return rows.length?`<div class="flowcards">${rows.map(o=>flowCard(o,tab)).join('')}</div>`:'<div class="flowempty">Δεν υπάρχουν εγγραφές.</div>'}
function showBarcodes(orderId){let p=state?.order_barcodes?.[String(orderId)],rows=p?.units||[];openModal('Barcodes',rows.length?`<div class="flowtablewrap"><table class="flowtable"><thead><tr><th>Προϊόν</th><th>Barcode</th><th>Status</th><th>Ώρα</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.product_text||'')}</td><td><b>${esc(r.unique_code||'')}</b></td><td>${esc(r.status_label||'')}</td><td>${esc((r.delivered_at||r.ready_at||'').slice(0,16))}</td></tr>`).join('')}</tbody></table></div>`:'<div class="flowempty">Δεν υπάρχουν barcodes.</div>')}
function renderSummary(){let s=state?.flow?.summary||{};return`<div class="flowsummary"><button class="flowmetric prod" onclick="summaryDetail('in_production')"><b>${Number(s.in_production||0)}</b><span>ΣΕ ΠΑΡΑΓΩΓΗ</span></button><button class="flowmetric ready" onclick="summaryDetail('ready_today')"><b>${Number(s.ready_today||0)}</b><span>ΕΤΟΙΜΑ ΣΗΜΕΡΑ</span></button><button class="flowmetric delivered" onclick="summaryDetail('delivered_today')"><b>${Number(s.delivered_today||0)}</b><span>ΠΑΡΑΔΟΘΗΚΑΝ ΣΗΜΕΡΑ</span></button><button class="flowmetric waiting" onclick="summaryDetail('ready_waiting')"><b>${Number(s.ready_waiting||0)}</b><span>ΕΤΟΙΜΑ ΠΡΟΣ ΠΑΡΑΔΟΣΗ</span></button><button class="flowmetric overdue" onclick="summaryDetail('overdue')"><b>${Number(s.overdue||0)}</b><span>ΚΑΘΥΣΤΕΡΗΜΕΝΑ ΠΑΡΑΓΩΓΗΣ</span></button></div><div class="flowprogress"><span>Πρόοδος παραγωγής σήμερα: ${Number(s.completed_today||0)} / ${Number(s.workload_today||0)} — ${Number(s.progress_pct||0).toFixed(0)}%</span><div class="flowprogressbar"><span style="width:${Math.max(0,Math.min(100,Number(s.progress_pct||0)))}%"></span></div></div>`}
let remoteSummarySort={kind:'',key:'',desc:false};
function remoteSummaryDim(r){if(r?.dimension)return String(r.dimension);let w=Number(r?.width_cm||0),l=Number(r?.length_cm||0),suffix=r?.low_spring?'Χ':'';if(w&&l)return`${w}×${l}${suffix}`;if(w)return`Πλ. ${w}${suffix}`;if(l)return`Μήκ. ${l}${suffix}`;return'—'}
function remoteSummaryValue(r,key){if(key==='quantity')return Number(r.quantity||0);if(key==='dimension')return remoteSummaryDim(r);return String(r[key]||'').toLocaleLowerCase('el-GR')}
function remoteSummaryHead(key,label){let m=remoteSummarySort.key===key?(remoteSummarySort.desc?' ▼':' ▲'):'';return`<th class="sortable" onclick="sortRemoteSummary('${key}')">${label}${m}</th>`}

-batch">#${String(Number(r.batch_number||0)).padStart(2,'0')}</span><span class="remote-day-qty">${Number(r.quantity||0)} τεμ.</span></div><div class="remote-day-customer">${esc(r.customer||'—')}</div><div class="remote-day-product">${esc(r.product||'—')} · ${esc(r.dimension||'—')}</div>${String(r.notes||'').trim()?`<div class="remote-day-notes">${esc(r.notes||'')}</div>`:''}<div class="remote-day-meta"><span>Παράδοση ${esc(r.delivery_date_display||'—')}</span><span>${esc(r.status||'')}</span></div></div>`).join('')}</div>`:'<div class="flowempty">Δεν υπάρχει παραγωγή για την επιλεγμένη προβολή.</div>'}`}
function printRemoteProductionDay(){let p=remoteProductionPayload(),rows=p?.rows||[];if(!p)return;let w=window.open('','_blank');if(!w)return;let body=rows.map((r,i)=>`<tr><td>${i+1}</td><td>#${String(Number(r.batch_number||0)).padStart(2,'0')}</td><td>${esc(r.customer||'—')}</td><td>${esc(r.product||'—')}</td><td>${esc(r.dimension||'—')}</td><td>${Number(r.quantity||0)}</td><td>${esc(r.notes||'')}</td><td>${esc(r.delivery_date_display||'—')}</td><td>${esc(r.status||'')}</td></tr>`).join('');w.document.write(`<html><head><meta charset="utf-8"><title>Παραγωγή ${d(p.date)}</title><style>@page{size:A4 landscape;margin:8mm}body{font-family:Arial,sans-serif;font-size:9px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #aaa;padding:4px;text-align:left}</style></head><body><h2>Παραγωγή ημέρας ${d(p.date)}</h2><table><thead><tr><th>Α/Α</th><th>ΠΑΡΤΙΔΑ</th><th>ΠΕΛΑΤΗΣ</th><th>ΤΥΠΟΣ</th><th>ΔΙΑΣΤΑΣΗ</th><th>ΤΕΜ.</th><th>ΠΑΡΑΤΗΡΗΣΕΙΣ</th><th>ΗΜ. ΠΑΡΑΔΟΣΗΣ</th><th>STATUS</th></tr></thead><tbody>${body}</tbody></table></body></html>`);w.document.close();setTimeout(()=>w.print(),120)}
